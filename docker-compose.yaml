services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - distributor_0
    environment:
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE_PREFIX=/output/0/output_
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - DISTRIBUTOR_AMOUNT=1
    - DISTRIBUTOR_PREFIX=distributor
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  distributor_0:
    build:
      context: ./src/
      dockerfile: distributor/Dockerfile
    container_name: distributor_0
    depends_on:
    - q1_join
    - bank_mapper_0
    environment:
    - ID=0
    - INPUT_QUEUE=input_queue
    - Q1_QUEUE=q1_queue
    - Q2_QUEUE=q2_queue
    - Q3_QUEUE=q3_queue
    - Q4_QUEUE=q4_queue
    - Q5_QUEUE=q5_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1

  # QUERY 1
  q1_join:
    build:
      context: ./src/
      dockerfile: q1_join/Dockerfile
    container_name: q1_join
    depends_on:
    - gateway
    environment:
    - INPUT_QUEUE=q1_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1

  # QUERY 2
  bank_mapper_0:
    build:
      context: ./src/
      dockerfile: bank_mapper/Dockerfile
    container_name: bank_mapper_0
    depends_on:
    - bank_max_0
    environment:
    - ID=0
    - INPUT_QUEUE=q2_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - BANK_MAX_AMOUNT=1
    - BANK_MAX_PREFIX=bank_max
  bank_max_0:
    build:
      context: ./src/
      dockerfile: bank_max/Dockerfile
    container_name: bank_max_0
    depends_on:
    - q2_join
    environment:
    - ID=0
    - OUTPUT_QUEUE=q2_join_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - BANK_MAX_AMOUNT=1
    - BANK_MAX_PREFIX=bank_max
  q2_join:
    build:
      context: ./src/
      dockerfile: q2_join/Dockerfile
    container_name: q2_join
    depends_on:
    - gateway
    environment:
    - ID=0
    - INPUT_QUEUE=q2_join_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - BANK_MAX_AMOUNT=1

  # QUERY 3


  # QUERY 4
  accounts_mapper_0:
    build:
      context: ./src/
      dockerfile: accounts_mapper/Dockerfile
    container_name: accounts_mapper_0
    depends_on: 
    - three_chain_0
    - three_chain_1
    - three_chain_2
    environment:
    - ID=0
    - INPUT_QUEUE=query_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_MAPPER_AMOUNT=3
    - ACCOUNTS_MAPPER_PREFIX=accounts_mapper
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
  accounts_mapper_1:
    build:
      context: ./src/
      dockerfile: accounts_mapper/Dockerfile
    container_name: accounts_mapper_1
    depends_on: 
    - three_chain_0
    - three_chain_1
    - three_chain_2
    environment:
    - ID=1
    - INPUT_QUEUE=query_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_MAPPER_AMOUNT=3
    - ACCOUNTS_MAPPER_PREFIX=accounts_mapper
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
  accounts_mapper_2:
    build:
      context: ./src/
      dockerfile: accounts_mapper/Dockerfile
    container_name: accounts_mapper_2
    depends_on: 
    - three_chain_0
    - three_chain_1
    - three_chain_2
    environment:
    - ID=2
    - INPUT_QUEUE=query_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_MAPPER_AMOUNT=3
    - ACCOUNTS_MAPPER_PREFIX=accounts_mapper
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
  three_chain_0:
    build:
      context: ./src/
      dockerfile: three_chain/Dockerfile
    container_name: three_chain_0
    depends_on: 
    - q4_join
    environment:
    - ID=0
    - OUTPUT_QUEUE=three_chain_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
    - ACCOUNTS_MAPPER_AMOUNT=3
  three_chain_1:
    build:
      context: ./src/
      dockerfile: three_chain/Dockerfile
    container_name: three_chain_1
    depends_on: 
    - q4_join
    environment:
    - ID=1
    - OUTPUT_QUEUE=three_chain_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
    - ACCOUNTS_MAPPER_AMOUNT=3
  three_chain_2:
    build:
      context: ./src/
      dockerfile: three_chain/Dockerfile
    container_name: three_chain_2
    depends_on: 
    - q4_join
    environment:
    - ID=2
    - OUTPUT_QUEUE=three_chain_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
    - ACCOUNTS_MAPPER_AMOUNT=3
  q4_join:
    build:
      context: ./src/
      dockerfile: q4_join/Dockerfile
    container_name: q4_join
    depends_on: 
    - gateway
    environment:
    - INPUT_QUEUE=three_chain_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - SCATTER_GATHER_TRAN_THRESHOLD=5

  # QUERY 5
