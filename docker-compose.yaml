services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - usd_filter_0
    environment:
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE_PREFIX=/output/output_
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ../datasets:/datasets
    - ../output:/output
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  count_0:
    build:
      context: ./src/
      dockerfile: count/Dockerfile
    container_name: count_0
    depends_on:
    - gateway
    environment:
    - ID=0
    - INPUT_QUEUE=count_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - COUNT_AMOUNT=1
    - COUNT_PREFIX=count
  usd_filter_0:
    build:
      context: ./src/
      dockerfile: filter/Dockerfile
    container_name: usd_filter_0
    depends_on:
    - count_0
    - max_bank_0
    environment:
    - FILTER_KIND=usd
    - ID=0
    - INPUT_QUEUE=input_queue
    - OUTPUT_QUEUE=count_queue
    - Q2_OUTPUT_QUEUE=q2_input_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - FILTER_AMOUNT=1
    - FILTER_PREFIX=filter
  max_bank_0:
    build:
      context: ./src/
      dockerfile: max_bank/Dockerfile
    container_name: max_bank_0
    depends_on:
    - q2_join
    environment:
    - ID=0
    - INPUT_QUEUE=q2_input_queue
    - OUTPUT_QUEUE=q2_join_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - MAX_BANK_AMOUNT=1
    - MAX_BANK_PREFIX=filter
  q2_join:
    build:
      context: ./src/
      dockerfile: q2_join/Dockerfile
    container_name: q2_join
    depends_on:
    - gateway
    environment:
    - ID=0
    - INPUT_QUEUE=q2_join_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - Q2_JOIN_AMOUNT=1
    - Q2_JOIN_PREFIX=q2_join
  accounts_mapper_0:
    build:
      context: ./src/
      dockerfile: accounts_mapper/Dockerfile
    container_name: accounts_mapper_0
    depends_on: 
    - three_chain_0
    - three_chain_1
    - three_chain_2
    environment:
    - ID=0
    - INPUT_QUEUE=query_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_MAPPER_AMOUNT=3
    - ACCOUNTS_MAPPER_PREFIX=accounts_mapper
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
  accounts_mapper_1:
    build:
      context: ./src/
      dockerfile: accounts_mapper/Dockerfile
    container_name: accounts_mapper_1
    depends_on: 
    - three_chain_0
    - three_chain_1
    - three_chain_2
    environment:
    - ID=1
    - INPUT_QUEUE=query_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_MAPPER_AMOUNT=3
    - ACCOUNTS_MAPPER_PREFIX=accounts_mapper
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
  accounts_mapper_2:
    build:
      context: ./src/
      dockerfile: accounts_mapper/Dockerfile
    container_name: accounts_mapper_2
    depends_on: 
    - three_chain_0
    - three_chain_1
    - three_chain_2
    environment:
    - ID=2
    - INPUT_QUEUE=query_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - ACCOUNTS_MAPPER_AMOUNT=3
    - ACCOUNTS_MAPPER_PREFIX=accounts_mapper
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
  three_chain_0:
    build:
      context: ./src/
      dockerfile: three_chain/Dockerfile
    container_name: three_chain_0
    depends_on: 
    - q4_join
    environment:
    - ID=0
    - OUTPUT_QUEUE=three_chain_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
    - ACCOUNTS_MAPPER_AMOUNT=3
  three_chain_1:
    build:
      context: ./src/
      dockerfile: three_chain/Dockerfile
    container_name: three_chain_1
    depends_on: 
    - q4_join
    environment:
    - ID=1
    - OUTPUT_QUEUE=three_chain_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
    - ACCOUNTS_MAPPER_AMOUNT=3
  three_chain_2:
    build:
      context: ./src/
      dockerfile: three_chain/Dockerfile
    container_name: three_chain_2
    depends_on: 
    - q4_join
    environment:
    - ID=2
    - OUTPUT_QUEUE=three_chain_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - THREE_CHAIN_PREFIX=three_chain
    - ACCOUNTS_MAPPER_AMOUNT=3
  q4_join:
    build:
      context: ./src/
      dockerfile: q4_join/Dockerfile
    container_name: q4_join
    depends_on: 
    - gateway
    environment:
    - INPUT_QUEUE=three_chain_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - THREE_CHAIN_AMOUNT=3
    - SCATTER_GATHER_TRAN_THRESHOLD=5