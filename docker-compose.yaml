services:
  client_0:
    build:
      context: ./src/
      dockerfile: client/Dockerfile
    container_name: client_0
    depends_on:
    - distributor_0
    environment:
    - INPUT_FILE=/datasets/input_0.csv
    - OUTPUT_FILE_PREFIX=/output/0/output_
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    volumes:
    - ./datasets:/datasets
    - ./output:/output
  gateway:
    build:
      context: ./src/
      dockerfile: gateway/Dockerfile
    container_name: gateway
    depends_on:
      rabbitmq:
        condition: service_healthy
    environment:
    - INPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - OUTPUT_QUEUE=input_queue
    - PYTHONUNBUFFERED=1
    - SERVER_HOST=gateway
    - SERVER_PORT=5678
    - DISTRIBUTOR_AMOUNT=1
    - DISTRIBUTOR_PREFIX=distributor
  rabbitmq:
    build:
      context: ./src/rabbitmq
      dockerfile: Dockerfile
    container_name: rabbitmq
    environment:
    - RABBITMQ_LOG_LEVELS=error
    healthcheck:
      interval: 5s
      retries: 10
      start_period: 50s
      test: rabbitmq-diagnostics check_port_connectivity
      timeout: 3s
    ports:
    - 5672:5672
    - 15672:15672
  distributor_0:
    build:
      context: ./src/
      dockerfile: distributor/Dockerfile
    container_name: distributor_0
    depends_on:
    - count_0
    - max_bank_0
    environment:
    - ID=0
    - INPUT_QUEUE=input_queue
    - Q1_QUEUE=q1_queue
    - Q2_QUEUE=q2_queue
    - Q3_QUEUE=q3_queue
    - Q4_QUEUE=q4_queue
    - Q5_QUEUE=q5_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
  count_0:
    build:
      context: ./src/
      dockerfile: count/Dockerfile
    container_name: count_0
    depends_on:
    - gateway
    environment:
    - ID=0
    - INPUT_QUEUE=q1_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - COUNT_AMOUNT=1
    - COUNT_PREFIX=count
  max_bank_0:
    build:
      context: ./src/
      dockerfile: max_bank/Dockerfile
    container_name: max_bank_0
    depends_on:
    - q2_join
    environment:
    - ID=0
    - INPUT_QUEUE=q2_queue
    - OUTPUT_QUEUE=q2_join_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - MAX_BANK_AMOUNT=1
    - MAX_BANK_PREFIX=filter
  q2_join:
    build:
      context: ./src/
      dockerfile: q2_join/Dockerfile
    container_name: q2_join
    depends_on:
    - gateway
    environment:
    - ID=0
    - INPUT_QUEUE=q2_join_queue
    - OUTPUT_QUEUE=results_queue
    - MOM_HOST=rabbitmq
    - PYTHONUNBUFFERED=1
    - Q2_JOIN_AMOUNT=1
    - Q2_JOIN_PREFIX=q2_join
